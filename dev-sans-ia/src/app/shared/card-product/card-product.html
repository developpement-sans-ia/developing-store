
<article class="flex flex-col bg-blancCasse">
    <div class="aspect-square bg-grisClair overflow-hidden flex items-center justify-center">
        <img [src]="product().image" [alt]="product().title" class="w-full h-full object-contain p-6" />
    </div>
    <div class="bg-grisClair p-4 text-center">
        <p class="font-pontanoSans text-noir truncate">{{product().title}}</p>
        <p class="font-bodoniModa text-dore font-semibold">{{product().price}} €</p>
    </div>
</article>
