<!--Overlay sombre-->
<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm"
    (click)="close.emit()">


    <div class="bg-grisClair p-6 border border-dore grid lg:grid-cols-2 gap-5 relative w-full max-w-5xl max-h-[90vh] overflow-y-auto"
        (click)="$event.stopPropagation()">
        <!-- Bouton Fermer -->
        <button
            class="absolute top-2 right-2 w-10 h-10 flex items-center justify-center bg-grisAnthracite text-blancCassé border border-dore hover:bg-dore hover:text-blancCassé transition-colors z-10"
            (click)="close.emit()" title="Fermer">
            ✕
        </button>

        <!-- Image -->
        <img class="object-cover" [src]="product().image" [alt]="product().title">

        <!-- Détails -->
        <div class="flex flex-col justify-center p-4">
            <h5 class="mb-6 text-3xl text-dore font-bodoniModa uppercase text-center lg:text-left">
                {{ product().title }}
            </h5>

            <!-- Catégorie -->
            <p class="mb-6 text-sm uppercase tracking-widest text-gray-500">
                {{ product().category }}
            </p>

            <!-- Description -->
            <p class="mb-6 text-sm flex-grow">
                {{ product().description }}
            </p>

            <!-- Prix -->
            <p class="mb-6 text-xl font-bold">
                {{ product().price }} €
            </p>

            <!-- Bouton Panier -->
            <div>
                <button type="button"
                    class="inline-flex items-center text-white bg-grisAnthracite border border-dore hover:bg-dore hover:text-blancCassé transition-colors p-3">
                    Ajouter au panier
                </button>
            </div>
        </div>
    </div>
</div>
