<section class="bg-blancCasse border border-dore animate-fade-in-up">
    <div class="container text-center gap-4">
        <div>
            <img [src]=" product().image" (click)="selectProduct.emit(product())"
                class="aspect-[8/10] object-contain" />
        </div>
        <div class="bg-grisClair p-4">
            <p class="font-pontanoSans text-noir text-center lg:truncate md:truncate">{{product().title}}</p>
            <p class="font-bodoniModa text-dore text-center font-semibold">{{product().price}} €</p>
        </div>
    </div>
</section>
