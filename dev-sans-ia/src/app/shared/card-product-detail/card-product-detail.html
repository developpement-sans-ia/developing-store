<!-- Image -->
<div class="grid lg:grid-cols-2 gap-5 w-full" (click)="openDetail.emit(product())">
    <img class="object-cover" [src]="product().image" [alt]="product().title">

    <!-- Détails -->
    <div class="flex flex-col justify-center p-4">
        <h5 class="mb-6 text-3xl text-dore font-bodoniModa uppercase text-center lg:text-left">
            {{ product().title }}
        </h5>

        <!-- Catégorie -->
        <p class="mb-6 text-sm uppercase tracking-widest text-gray-500">
            {{ product().category }}
        </p>

        <!-- Description -->
        <p class="mb-6 text-sm flex-grow">
            {{ product().description }}
        </p>

        <!-- Prix -->
        <p class="mb-6 text-xl font-bold">
            {{ product().price }} €
        </p>

        <ng-content></ng-content>
    </div>
</div>
